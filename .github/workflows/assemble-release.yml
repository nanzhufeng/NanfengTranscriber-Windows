name: Assemble verified release upload
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      sha256:
        required: true
        type: string
      bytes:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      part_count:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: assemble-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify, assemble, remove transport parts, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          EXPECTED_BYTES: ${{ inputs.bytes }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PART_COUNT: ${{ inputs.part_count }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/assemble_release.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/assemble_release.py"
          python "$RUNNER_TEMP/assemble_release.py"
